<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fond beige -->
  <rect width="400" height="300" fill="#F5F1E8"/>
  
  <!-- Cercle décoratif -->
  <circle cx="200" cy="140" r="130" fill="#2D6A4F" opacity="0.1"/>
  
  <!-- Bâtiment restaurant -->
  <rect x="120" y="100" width="160" height="120" rx="8" fill="#ffffff" stroke="#2D6A4F" stroke-width="3"/>
  
  <!-- Toit -->
  <polygon points="100,100 200,40 300,100" fill="#2D6A4F"/>
  <polygon points="110,100 200,50 290,100" fill="#FF6B35" opacity="0.3"/>
  
  <!-- Porte -->
  <rect x="180" y="160" width="40" height="60" rx="4" fill="#2D6A4F"/>
  <circle cx="210" cy="190" r="3" fill="#FF6B35"/>
  
  <!-- Fenêtres -->
  <rect x="135" y="120" width="30" height="30" rx="4" fill="#FF6B35" opacity="0.3"/>
  <rect x="235" y="120" width="30" height="30" rx="4" fill="#FF6B35" opacity="0.3"/>
  
  <!-- Volets -->
  <line x1="150" y1="120" x2="150" y2="150" stroke="#2D6A4F" stroke-width="2"/>
  <line x1="135" y1="135" x2="165" y2="135" stroke="#2D6A4F" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="150" stroke="#2D6A4F" stroke-width="2"/>
  <line x1="235" y1="135" x2="265" y2="135" stroke="#2D6A4F" stroke-width="2"/>
  
  <!-- Enseigne -->
  <rect x="140" y="75" width="120" height="25" rx="4" fill="#FF6B35"/>
  <text x="200" y="92" 
        font-family="'Poppins', sans-serif" 
        font-size="12" 
        font-weight="600" 
        fill="#ffffff" 
        text-anchor="middle">RESTAURANT</text>
  
  <!-- Texte -->
  <text x="200" y="260" 
        font-family="'Poppins', sans-serif" 
        font-size="16" 
        font-weight="400" 
        fill="#2D6A4F" 
        text-anchor="middle">Restaurant Partenaire</text>
</svg>
