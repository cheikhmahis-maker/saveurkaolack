<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Dégradé de fond -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6A4F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#40916C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:0.3" />
    </linearGradient>
    
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#ffffff" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Fond principal -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>
  <rect width="800" height="400" fill="url(#dots)"/>
  
  <!-- Cercles décoratifs -->
  <circle cx="100" cy="100" r="80" fill="#FF6B35" opacity="0.2"/>
  <circle cx="700" cy="300" r="120" fill="#FF6B35" opacity="0.15"/>
  <circle cx="600" cy="80" r="40" fill="#ffffff" opacity="0.1"/>
  
  <!-- Forme géométrique -->
  <polygon points="750,50 780,150 680,120" fill="#FF6B35" opacity="0.3"/>
  <polygon points="50,350 100,280 120,380" fill="#ffffff" opacity="0.1"/>
  
  <!-- Contenu central -->
  <g transform="translate(400, 200)">
    <!-- Cercle central -->
    <circle cx="0" cy="0" r="100" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#FF6B35" stroke-width="4" opacity="0.6"/>
    
    <!-- Étoile/Forme décorative -->
    <polygon points="0,-60 15,-15 60,0 15,15 0,60 -15,15 -60,0 -15,-15" 
             fill="#FF6B35" opacity="0.4"/>
    
    <!-- Initiales -->
    <text x="0" y="10" 
          font-family="'Playfair Display', serif" 
          font-size="48" 
          font-weight="700" 
          fill="#ffffff" 
          text-anchor="middle"
          opacity="0.9">SK</text>
  </g>
  
  <!-- Texte -->
  <text x="400" y="360" 
        font-family="'Poppins', sans-serif" 
        font-size="18" 
        font-weight="300" 
        fill="#ffffff" 
        text-anchor="middle"
        opacity="0.8">Saveur Kaolack — La cuisine sénégalaise authentique</text>
</svg>
